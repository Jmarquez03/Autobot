controller_manager:
  ros__parameters:
    update_rate: 50  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    ackermann_controller:
      type: ackermann_steering_controller/AckermannSteeringController

ackermann_controller:
  ros__parameters:
    left_rear_wheel_joint: left_rear_wheel_joint
    right_rear_wheel_joint: right_rear_wheel_joint
    left_front_wheel_joint: front_left_wheel_joint
    right_front_wheel_joint: front_right_wheel_joint
    left_steering_joint: front_left_pivot_joint
    right_steering_joint: front_right_pivot_joint
    
    wheelbase: 0.3
    wheel_separation: 0.15
    wheel_radius: 0.05
    steering_limit: 0.6
    
    cmd_vel_timeout: 0.5
    use_stamped_vel: false
    
    # PID parameters
    velocity_rolling_window_size: 10
    position_feedback: true
    
    # Publish states as TF
    enable_odom_tf: false  # Set to false since ESP32 already publishes odom->base_footprint
    
    # Topic names
    cmd_vel_topic: cmd_vel
    odom_topic: odom